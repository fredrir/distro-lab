mounts:
  - [dlabstate, /var/lib/dlab-state, virtiofs, "nofail,x-systemd.device-timeout=10s", "0", "0"]

write_files:
  - path: /usr/local/bin/dlab-idle-mark
    permissions: "0755"
    content: |
      #!/bin/sh
      state=/var/lib/dlab-state
      [ -d "$state" ] || exit 0
      touch "$state/alive"

      busy=0

      if [ -f "$state/keepalive" ]; then
          u=$(cat "$state/keepalive" 2>/dev/null || echo 0)
          case "$u" in '' | *[!0-9]*) u=0 ;; esac
          if [ "$u" -gt "$(date +%s)" ]; then busy=1; fi
      fi

      if [ "$(loginctl list-sessions --no-legend 2>/dev/null | wc -l)" -gt 0 ]; then busy=1; fi

      if [ "$(ss -Htn state established 2>/dev/null | grep -cv '127\.0\.0\.1')" -gt 0 ]; then busy=1; fi

      load=$(awk '{print $1}' /proc/loadavg)
      if awk -v l="$load" 'BEGIN { exit !(l >= 0.30) }'; then busy=1; fi

      disk=$(awk '{s += $6 + $10} END {print (s + 0) * 512}' /proc/diskstats)
      net=$(cat /sys/class/net/*/statistics/rx_bytes /sys/class/net/*/statistics/tx_bytes 2>/dev/null |
            awk '{s += $1} END {print s + 0}')
      cur=$((disk + net))

      prev_file=/run/dlab-io-prev
      if [ -f "$prev_file" ]; then
          prev=$(cat "$prev_file" 2>/dev/null || echo 0)
          case "$prev" in '' | *[!0-9]*) prev=$cur ;; esac
          if [ "$((cur - prev))" -gt 20971520 ]; then busy=1; fi
      fi
      printf '%s' "$cur" > "$prev_file"

      if [ "$busy" -eq 1 ] || [ ! -f "$state/busy" ]; then
          touch "$state/busy"
      fi
      exit 0

  - path: /etc/systemd/system/dlab-idle-mark.service
    content: |
      [Unit]
      Description=Publish dlab idle markers to the host state share

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/dlab-idle-mark

  - path: /etc/systemd/system/dlab-idle-mark.timer
    content: |
      [Unit]
      Description=Publish dlab idle markers every 30s

      [Timer]
      OnBootSec=15s
      OnUnitActiveSec=30s
      AccuracySec=5s

      [Install]
      WantedBy=timers.target

runcmd:
  - emerge-webrsync
  - emerge --getbinpkg --quiet app-emulation/qemu-guest-agent
  - systemctl daemon-reload
  - systemctl enable --now dlab-idle-mark.timer
